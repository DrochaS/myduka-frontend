[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

[context.staging]
  command = "npm run build"
  environment = { VITE_APP_ENV = "staging" }

[context.production]
  command = "npm run build"
  environment = { VITE_APP_ENV = "production" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
